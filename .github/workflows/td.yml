name: 03 - 📩 دانلودر تلگرام

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: '🔗 لینک پست تلگرام (مثال: https://t.me/channel/123)'
        required: true
        type: string

jobs:
  tg-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: بررسی لینک تلگرام
        run: |
          if [ -z "${{ github.event.inputs.telegram_link }}" ]; then
            echo ""
            echo "❌ لینک تلگرام وارد نشده است!"
            echo ""
            exit 1
          fi
          echo "✅ لینک تلگرام دریافت شد"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget jq zip unzip python3

      - name: دانلود از تلگرام با پشتیبانی از تمام فایل‌ها
        run: |
          TELEGRAM_LINK="${{ github.event.inputs.telegram_link }}"
          
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          SPLIT_MB=45
          
          BACKUP_DIR="/tmp/telegram_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          mkdir -p telegram_downloads
          
          echo "📩 Telegram Downloader"
          echo "🔗 Link: $TELEGRAM_LINK"
          echo ""

          # Extract channel and message ID
          CHANNEL=$(echo "$TELEGRAM_LINK" | sed 's|https://t.me/||' | sed 's|http://t.me/||' | cut -d'/' -f1)
          MSG_ID=$(echo "$TELEGRAM_LINK" | sed 's|https://t.me/||' | sed 's|http://t.me/||' | cut -d'/' -f2 | sed 's|?.*||')
          
          echo "📢 Channel: $CHANNEL"
          echo "📝 Message ID: $MSG_ID"
          echo ""

          # Create folder
          FOLDER_NAME="telegram_${CHANNEL}_${MSG_ID}"
          mkdir -p "$BACKUP_DIR/$FOLDER_NAME"

          # Use tgdownloader (public API) to get file info
          echo "📥 Fetching Telegram post data..."
          
          # Method 1: Try public Telegram API
          TG_API_URL="https://tg.i-c-a.su/json/${CHANNEL}/${MSG_ID}"
          curl -sL -o /tmp/post_data.json "$TG_API_URL"
          
          if [ -s /tmp/post_data.json ]; then
            echo "✅ Got data from Telegram API"
            
            # Extract text
            TEXT=$(cat /tmp/post_data.json | jq -r '.text // ""')
            if [ -n "$TEXT" ] && [ "$TEXT" != "null" ]; then
              echo "$TEXT" > "$BACKUP_DIR/$FOLDER_NAME/message.txt"
              echo "✅ Text saved"
            fi
            
            # Extract ALL media files (photos, videos, documents, etc)
            # Check for documents first (exe, apk, pdf, zip, etc)
            DOC_COUNT=$(cat /tmp/post_data.json | jq '.document // [] | length')
            
            if [ "$DOC_COUNT" -gt 0 ]; then
              echo "📁 Found $DOC_COUNT document(s)"
              for i in $(seq 0 $((DOC_COUNT - 1))); do
                FILE_NAME=$(cat /tmp/post_data.json | jq -r ".document[$i].file_name // \"document_$i\"")
                FILE_SIZE=$(cat /tmp/post_data.json | jq -r ".document[$i].file_size // 0")
                FILE_ID=$(cat /tmp/post_data.json | jq -r ".document[$i].id // \"\"")
                
                echo "📄 Downloading: $FILE_NAME (Size: $((FILE_SIZE / 1024 / 1024)) MB)"
                
                # Download file using tgdownloader
                curl -sL -o "$BACKUP_DIR/$FOLDER_NAME/$FILE_NAME" \
                  "https://tg.i-c-a.su/dl/${CHANNEL}/${MSG_ID}/$FILE_NAME"
                
                if [ -f "$BACKUP_DIR/$FOLDER_NAME/$FILE_NAME" ] && [ -s "$BACKUP_DIR/$FOLDER_NAME/$FILE_NAME" ]; then
                  echo "✅ Downloaded: $FILE_NAME"
                fi
              done
            fi
            
            # Extract videos
            VIDEO_COUNT=$(cat /tmp/post_data.json | jq '.video // [] | length')
            if [ "$VIDEO_COUNT" -gt 0 ]; then
              echo "🎬 Found $VIDEO_COUNT video(s)"
              for i in $(seq 0 $((VIDEO_COUNT - 1))); do
                VIDEO_NAME=$(cat /tmp/post_data.json | jq -r ".video[$i].file_name // \"video_$i.mp4\"")
                VIDEO_SIZE=$(cat /tmp/post_data.json | jq -r ".video[$i].file_size // 0")
                
                echo "🎬 Downloading: $VIDEO_NAME"
                
                curl -sL -o "$BACKUP_DIR/$FOLDER_NAME/$VIDEO_NAME" \
                  "https://tg.i-c-a.su/dl/${CHANNEL}/${MSG_ID}/$VIDEO_NAME"
                
                if [ -f "$BACKUP_DIR/$FOLDER_NAME/$VIDEO_NAME" ]; then
                  echo "✅ Video downloaded"
                fi
              done
            fi
            
            # Extract photos
            PHOTO_COUNT=$(cat /tmp/post_data.json | jq '.photo // [] | length')
            if [ "$PHOTO_COUNT" -gt 0 ]; then
              echo "🖼️ Found $PHOTO_COUNT photo(s)"
              for i in $(seq 0 $((PHOTO_COUNT - 1))); do
                PHOTO_NAME="photo_$((i+1)).jpg"
                echo "🖼️ Downloading: $PHOTO_NAME"
                
                curl -sL -o "$BACKUP_DIR/$FOLDER_NAME/$PHOTO_NAME" \
                  "https://tg.i-c-a.su/dl/${CHANNEL}/${MSG_ID}/$PHOTO_NAME"
              done
              echo "✅ Photos downloaded"
            fi
            
          else
            echo "⚠️ API method failed, trying alternative..."
            
            # Method 2: Use html.parser with Python (more reliable)
            python3 << 'PYTHON_SCRIPT'
import urllib.request
import re
import json
import os
from html.parser import HTMLParser

channel = os.environ['CHANNEL']
msg_id = os.environ['MSG_ID']
backup_dir = os.environ['BACKUP_DIR']
folder_name = os.environ['FOLDER_NAME']

# Fetch the page
url = f"https://t.me/{channel}/{msg_id}?embed=1"
headers = {'User-Agent': 'Mozilla/5.0'}
req = urllib.request.Request(url, headers=headers)
response = urllib.request.urlopen(req)
html = response.read().decode('utf-8')

# Look for all potential file links
patterns = [
    r'https://cdn[^"\']+\.(exe|apk|zip|rar|7z|pdf|doc|docx|xls|xlsx|txt|mp4|mp3|jpg|jpeg|png|gif|webm|mkv|avi|mov)',
    r'https://[^"\']+telegram[^"\']+\.(exe|apk|zip|rar|7z|pdf|doc|docx|xls|xlsx|txt|mp4|mp3)',
]

all_links = set()
for pattern in patterns:
    matches = re.findall(pattern, html)
    for match in matches:
        if match.startswith('http'):
            all_links.add(match)

# Download each file
for idx, link in enumerate(all_links):
    filename = link.split('/')[-1].split('?')[0]
    if not filename or '.' not in filename:
        filename = f"file_{idx+1}.bin"
    
    print(f"Downloading: {filename}")
    try:
        req = urllib.request.Request(link, headers=headers)
        with urllib.request.urlopen(req) as response:
            data = response.read()
            filepath = os.path.join(backup_dir, folder_name, filename)
            with open(filepath, 'wb') as f:
                f.write(data)
            print(f"✅ Saved: {filename}")
    except Exception as e:
        print(f"❌ Failed: {filename} - {e}")
PYTHON_SCRIPT
          fi

          # Method 3: Direct download using known Telegram patterns
          echo ""
          echo "🔍 Scanning for any remaining files..."
          
          # Try to get direct download links from page source
          curl -sL -o /tmp/full_page.html \
            -H "User-Agent: Mozilla/5.0" \
            "https://t.me/${CHANNEL}/${MSG_ID}"
          
          # Look for file links in page source
          grep -oP 'https://[^"]+\.(exe|apk|zip|rar|7z|pdf|doc|docx|xls|xlsx|txt|mp4|mp3|jpg|jpeg|png|gif|webm|mkv|avi|mov|bin|dmg|iso|img|msi|deb|rpm|sh|bat|ps1|py|js|html|css|json|xml|sql|db|csv|log|ini|cfg|conf|yaml|yml|toml)' /tmp/full_page.html | sort -u | while read -r file_url; do
            filename=$(basename "$file_url" | cut -d'?' -f1)
            echo "📥 Found: $filename"
            curl -sL -o "$BACKUP_DIR/$FOLDER_NAME/$filename" "$file_url"
          done

          # Create README.md
          echo ""
          echo "📝 Creating README..."
          
          {
            echo "# 📩 Telegram Download: ${CHANNEL}/${MSG_ID}"
            echo ""
            echo "## 📋 Information"
            echo "- **Channel:** @${CHANNEL}"
            echo "- **Message ID:** ${MSG_ID}"
            echo "- **Original Link:** [View Post](${TELEGRAM_LINK})"
            echo "- **Download Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 📁 Downloaded Files"
            echo ""
            
            cd "$BACKUP_DIR/$FOLDER_NAME"
            for file in *; do
              if [ -f "$file" ]; then
                size=$(stat -c%s "$file" 2>/dev/null || echo 0)
                size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
                echo "- **$file** (${size_mb} MB)"
              fi
            done
            cd - > /dev/null
            
            echo ""
            echo "## 🔗 Download Links"
            echo ""
            echo "Files are available in the \`telegram_downloads/${FOLDER_NAME}\` folder"
          } > "$BACKUP_DIR/$FOLDER_NAME/README.md"
          
          echo "✅ README created"
          
          # List all downloaded files
          echo ""
          echo "===== Downloaded Files ====="
          find "$BACKUP_DIR/$FOLDER_NAME" -type f -exec basename {} \; | sort
          
          # Cleanup
          rm -f /tmp/post_data.json /tmp/full_page.html

      - name: ذخیره‌سازی فایل‌های دانلود شده
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          echo "📤 Saving downloaded files to repository..."
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          
          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "❌ No files were downloaded!"
            exit 1
          fi
          
          echo "📁 Total files: $BACKUP_FILE_COUNT"
          
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH" || true
          
          mkdir -p telegram_downloads
          cp -r "$BACKUP_DIR"/* telegram_downloads/
          
          git add -A telegram_downloads/
          
          if git diff --cached --quiet; then
            echo "✅ No new changes to commit"
          else
            git commit -m "📩 Telegram download: ${{ github.event.inputs.telegram_link }} [skip ci]"
            
            # Try to push with retry
            for i in {1..5}; do
              if git push origin HEAD:"$BRANCH"; then
                echo "✅ Successfully pushed to GitHub!"
                break
              fi
              echo "⚠️ Push failed, retry $i/5..."
              sleep 5
              git pull origin "$BRANCH" --rebase || true
            done
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Download completed successfully!"
          echo "📁 Files saved in: telegram_downloads/"
          echo "=========================================="
