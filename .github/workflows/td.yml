name: 03 - 📥 دانلود خودکار تلگرام

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 لینک‌های تلگرام (حداکثر 1000 عدد، جدا با کاما، فاصله یا خط جدید)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📂 دریافت مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: آماده سازی گیت برای فایلهای بزرگ
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: 🔧 نصب ابزارهای ضروری
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip python3 python3-pip curl jq

      - name: 🐍 نصب کتابخانه‌های پایتون
        run: pip3 install requests

      - name: 📝 ساخت اسکریپت دانلودر
        run: |
          cat > telegram_downloader.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys, time, json, uuid, re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests

          def parse_links(raw_text):
              text = raw_text.replace(',', '\n').replace(' ', '\n')
              lines = text.splitlines()
              links = []
              for line in lines:
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith('http'):
                      links.append(line)
                  else:
                      if 't.me/' in line:
                          links.append('https://' + line.lstrip('/'))
              seen = set()
              unique_links = []
              for l in links:
                  if l not in seen:
                      seen.add(l)
                      unique_links.append(l)
              if len(unique_links) > 1000:
                  print(f"⚠️ بیش از 1000 لینک تشخیص داده شد. فقط 1000 لینک اول پردازش می‌شود.")
                  unique_links = unique_links[:1000]
              print(f"✅ {len(unique_links)} لینک معتبر شناسایی شد.")
              return unique_links

          def download_with_resume(url, dest, headers, max_retries=10, chunk_size=64*1024):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              temp = dest.with_name(f".{uuid.uuid4().hex}.partial")
              downloaded = temp.stat().st_size if temp.exists() else 0
              sess = requests.Session()
              sess.headers.update(headers)

              for attempt in range(max_retries):
                  try:
                      range_header = {"Range": f"bytes={downloaded}-"} if downloaded > 0 else {}
                      resp = sess.get(url, stream=True, timeout=30, headers=range_header)
                      resp.raise_for_status()
                      total = int(resp.headers.get('content-length', 0))
                      if downloaded > 0:
                          total += downloaded
                      mode = 'ab' if downloaded > 0 else 'wb'
                      with open(temp, mode) as f:
                          for chunk in resp.iter_content(chunk_size=chunk_size):
                              if chunk:
                                  f.write(chunk)
                                  downloaded += len(chunk)
                                  if total > 0:
                                      pct = downloaded / total * 100
                                      bar = '█' * int(40 * downloaded // total) + '░' * (40 - int(40 * downloaded // total))
                                      print(f"\rپیشرفت: |{bar}| {pct:.1f}% ({downloaded}/{total} بایت)", end='', flush=True)
                      print()
                      temp.replace(dest)
                      return True, dest.stat().st_size
                  except (requests.exceptions.ChunkedEncodingError,
                          requests.exceptions.ConnectionError,
                          requests.exceptions.Timeout) as e:
                      print(f"\n⚠️ قطع ارتباط: {e}. تلاش {attempt+1}/{max_retries}")
                      time.sleep(2 ** attempt)
                  except Exception as e:
                      print(f"\n❌ خطای مرگبار: {e}")
                      if temp.exists():
                          temp.unlink()
                      return False, 0
              print("\n❌ تعداد تلاش‌ها به پایان رسید.")
              if temp.exists():
                  temp.unlink()
              return False, 0

          def fetch_direct_link(telegram_link, headers):
              api = "https://telegramdownloader.net/proxy.php"
              data = {"telegram_link": telegram_link}
              try:
                  resp = requests.post(api, headers=headers, data=data, timeout=15)
                  resp.raise_for_status()
                  result = resp.json()
                  raw_url = result.get('data', {}).get('data', {}).get('link')
                  file_name = result.get('data', {}).get('data', {}).get('file_name')
                  if not raw_url or not file_name:
                      return None, None, "لینک مستقیم یافت نشد"
                  return raw_url, file_name, None
              except Exception as e:
                  return None, None, str(e)

          def sanitize_name(name):
              if not name.isascii():
                  rand = os.urandom(8).hex()
                  ext = Path(name).suffix
                  if not ext:
                      ext = ".bin"
                  return f"{rand}{ext}"
              clean = re.sub(r'[^a-zA-Z0-9._-]', '_', name)
              clean = re.sub(r'__+', '_', clean)
              return clean

          def process_one_link(link, base_dir, session_headers):
              print(f"\n🔗 دریافت اطلاعات {link}")
              url, fname, err = fetch_direct_link(link, session_headers)
              if err:
                  print(f"❌ خطا: {err}")
                  return None, 0, err
              print(f"📁 نام اصلی: {fname}")
              dest = base_dir / fname
              counter = 1
              orig_stem = dest.stem
              orig_suffix = dest.suffix
              while dest.exists():
                  dest = base_dir / f"{orig_stem}_{counter}{orig_suffix}"
                  counter += 1
              print(f"🚀 شروع دانلود...")
              success, size = download_with_resume(url, dest, session_headers)
              if not success:
                  return None, 0, "دانلود ناموفق"
              print(f"✅ دانلود کامل: {dest.name} ({size/1e6:.2f} MB)")
              return dest, size, None

          def main():
              tel_links_env = os.environ.get("TEL_LINKS", "").strip()
              if not tel_links_env:
                  print("❌ هیچ لینکی وارد نشده.")
                  sys.exit(1)
              links = parse_links(tel_links_env)
              if not links:
                  print("❌ هیچ لینک معتبری یافت نشد.")
                  sys.exit(1)

              base = Path("telegram")
              base.mkdir(parents=True, exist_ok=True)

              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

              results = []
              with ThreadPoolExecutor(max_workers=2) as executor:
                  futures = {executor.submit(process_one_link, link, base, headers): link for link in links}
                  for future in as_completed(futures):
                      link = futures[future]
                      try:
                          dest, size, err = future.result()
                          if err:
                              print(f"🔴 لینک ناموفق: {link} ({err})")
                          else:
                              results.append((dest, size))
                      except Exception as e:
                          print(f"🔴 خطا در پردازش {link}: {e}")

              if not results:
                  print("❌ هیچ فایلی با موفقیت دانلود نشد.")
                  sys.exit(1)

              renamed = []
              for dest, size in results:
                  safe_name = sanitize_name(dest.name)
                  if safe_name != dest.name:
                      new_path = dest.with_name(safe_name)
                      dest.rename(new_path)
                      print(f"🌐 تغییر نام: {dest.name} -> {safe_name}")
                      renamed.append((new_path, size))
                  else:
                      renamed.append((dest, size))

              print("\n🎉 همه عملیات با موفقیت پایان یافت.")
              print("فایل‌های نهایی:")
              for f, size in renamed:
                  print(f"   {f} ({size/1e6:.1f} MB)")

          if __name__ == "__main__":
              main()
          EOF
          chmod +x telegram_downloader.py

      - name: 🚀 اجرای دانلودر
        run: |
          export TEL_LINKS="${{ github.event.inputs.telegram_links }}"
          python3 telegram_downloader.py

      - name: 🗜️ فشرده‌سازی و تقسیم فایل‌ها به 90MB
        run: |
          SPLIT_MB=90
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          if [ ! -d "telegram" ] || [ -z "$(ls -A telegram 2>/dev/null)" ]; then
            echo "⚠️ هیچ فایلی برای پردازش وجود ندارد!"
            exit 1
          fi

          # Create backup directory
          BACKUP_DIR="/tmp/telegram_backup_$$"
          mkdir -p "$BACKUP_DIR"

          # Process each file in telegram directory
          for FILE in telegram/*; do
            [ -f "$FILE" ] || continue
            
            BASENAME=$(basename "$FILE")
            FILENAME_NO_EXT="${BASENAME%.*}"
            SIZE=$(stat -c%s "$FILE")
            SIZE_MB=$(( SIZE / 1024 / 1024 ))

            echo "Processing: $BASENAME (${SIZE_MB}MB)"
            
            # Create folder for this file
            FOLDER_NAME=$(echo "$FILENAME_NO_EXT" | sed 's/ /-/g' | tr -s '-')
            mkdir -p "$BACKUP_DIR/$FOLDER_NAME"

            if [ "$SIZE" -gt $(( SPLIT_MB * 1024 * 1024 )) ]; then
              echo "  Splitting into ${SPLIT_MB}MB parts..."
              zip -0 -s ${SPLIT_MB}m "$BACKUP_DIR/$FOLDER_NAME/${FOLDER_NAME}.zip" "$FILE"
            else
              echo "  File is small enough, archiving directly..."
              zip -0 "$BACKUP_DIR/$FOLDER_NAME/${FOLDER_NAME}.zip" "$FILE"
            fi

            # Generate README.md for this file
            FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
            README_FILE="$BACKUP_DIR/$FOLDER_NAME/README.md"
            
            {
              echo "# 📥 $FILENAME_NO_EXT"
              echo ""
              echo "## 📁 File Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **File Name** | \`$BASENAME\` |"
              echo "| **Total Size** | **${SIZE_MB} MB** |"
              echo "| **Status** | **Complete ✅** |"
              echo ""
              echo "---"
              echo ""
              echo "## 📥 Download Links"
              echo ""
              
              PART_COUNT=0
              for PART in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.zip "$BACKUP_DIR/$FOLDER_NAME/"*.z[0-9]* 2>/dev/null | sort -V); do
                [ -f "$PART" ] || continue
                PART_COUNT=$((PART_COUNT + 1))
                PART_BASENAME=$(basename "$PART")
                PART_ENCODED=$(urlencode "$PART_BASENAME")
                PART_SIZE=$(stat -c%s "$PART")
                PART_SIZE_MB=$(echo "scale=2; $PART_SIZE / 1024 / 1024" | bc)
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/telegram/${FOLDER_ENCODED}/${PART_ENCODED}"
                echo "| **Part $PART_COUNT** | \`$PART_BASENAME\` (${PART_SIZE_MB}MB) | [⬇️ Download]($RAW_LINK) |"
              done
              
              echo ""
              echo "---"
              echo ""
              echo "## 📖 How to Extract"
              echo ""
              echo "1. Download **all parts** into the **same folder**"
              echo "2. Open/extract \`${FOLDER_NAME}.zip\` — other parts are found automatically"
              echo ""
              echo "| OS | Instructions |"
              echo "|----|-------------|"
              echo "| **Windows** | Right-click \`${FOLDER_NAME}.zip\` → Extract Here (7-Zip or WinRAR) |"
              echo "| **Mac** | Double-click \`${FOLDER_NAME}.zip\` or use [The Unarchiver](https://theunarchiver.com/) |"
              echo "| **Linux** | \`unzip '${FOLDER_NAME}.zip'\` or right-click → Extract |"
              echo "| **Android** | Use [ZArchiver](https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver) → tap the main .zip file |"
              echo ""
              echo "---"
              echo ""
              echo "*Downloaded via Telegram Downloader Bot*"
            } > "$README_FILE"
            
            echo "  ✅ Created $PART_COUNT part(s) and README.md"
          done

          # Generate main README for telegram folder
          MAIN_README="telegram/README.md"
          {
            echo "# 📥 Telegram Downloads"
            echo ""
            echo "## 📊 Downloaded Files"
            echo ""
            echo "| # | File | Size | Download Link |"
            echo "|---|------|------|---------------|"
            
            NUM=0
            for FOLDER in "$BACKUP_DIR"/*/; do
              [ -d "$FOLDER" ] || continue
              FOLDER_NAME=$(basename "$FOLDER")
              NUM=$((NUM + 1))
              FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
              FOLDER_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/telegram/${FOLDER_ENCODED}"
              
              TOTAL_SIZE=0
              for PART in "$FOLDER"/*.zip "$FOLDER"/*.z[0-9]* 2>/dev/null; do
                [ -f "$PART" ] || continue
                SIZE=$(stat -c%s "$PART")
                TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
              done
              TOTAL_SIZE_MB=$(echo "scale=1; $TOTAL_SIZE / 1024 / 1024" | bc)
              
              echo "| $NUM | \`$FOLDER_NAME\` | ${TOTAL_SIZE_MB}MB | [📁 Open Folder]($FOLDER_LINK) |"
            done
            
            echo ""
            echo "---"
            echo ""
            echo "## 📖 Instructions"
            echo ""
            echo "1. Click on the folder link for the file you want"
            echo "2. Download all parts from that folder"
            echo "3. Put all parts in the same folder and extract the main `.zip` file"
            echo "4. Other parts are found automatically during extraction"
            echo ""
            echo "---"
            echo "*Last updated: $(date -u +'%Y-%m-%d %H:%M UTC')*"
          } > "$MAIN_README"

          # Copy everything to telegram folder
          cp -r "$BACKUP_DIR"/* telegram/

      - name: 📤 ارسال فایل‌ها به مخزن
        run: |
          git add -A telegram/
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi

          git commit -m "Telegram downloads - automatic 90MB split [skip ci]"
          
          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5..."
            if timeout 300 git push origin ${GITHUB_REF_NAME} 2>&1; then
              echo "✅ Push successful!"
              exit 0
            else
              if [ $i -lt 5 ]; then
                echo "⚠️ Push failed, retrying in 10 seconds..."
                sleep 10
                git fetch origin ${GITHUB_REF_NAME}
                git reset --hard origin/${GITHUB_REF_NAME}
              fi
            fi
          done
          
          echo "❌ Push failed after 5 attempts"
          exit 1
