---
name: 03 - 📩 دانلودر تلگرام

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 لینک‌های تلگرام (با فاصله، کاما یا خط جدید جدا کنید)'
        required: true
        type: string
      split_threshold_mb:
        description: '📦 حداکثر حجم هر قطعه (MB) - 0 = بدون تقسیم'
        required: false
        type: number
        default: 90
      subfolder:
        description: '📁 زیرپوشه دلخواه (اختیاری - خالی = مستقیم داخل telegram_downloads)'
        required: false
        type: string
        default: ''
      clean_previous:
        description: '🗑️ پاکسازی فایل‌های قبلی قبل از دانلود'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📂 دریافت مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🗑️ پاکسازی فایل‌های قبلی
        if: github.event.inputs.clean_previous == 'true'
        run: |
          if [ -d "telegram_downloads" ]; then
            echo "🗑️ در حال حذف فایل‌های قبلی..."
            rm -rf telegram_downloads
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A telegram_downloads/ 2>/dev/null || true
            git commit -m "🗑️ پاکسازی فایل‌های قبلی [skip ci]" 2>/dev/null || true
            git push 2>/dev/null || true
            echo "✅ پاکسازی انجام شد"
          fi

      - name: 🔧 نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget zip unzip python3 python3-pip
          pip3 install requests

      - name: 🚀 دانلود فایل‌ها از تلگرام
        env:
          TEL_LINKS: ${{ github.event.inputs.telegram_links }}
          SPLIT_MB: ${{ github.event.inputs.split_threshold_mb }}
          SUBFOLDER: ${{ github.event.inputs.subfolder }}
        run: |
          python3 << 'PYEOF'
          import os, re, sys, json, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          import subprocess

          # ── Config ──────────────────────────────────────────────
          TEL_LINKS = os.environ.get("TEL_LINKS", "").strip()
          SPLIT_MB = int(os.environ.get("SPLIT_MB", "0"))
          SUBFOLDER = os.environ.get("SUBFOLDER", "").strip()

          BASE_DIR = Path("telegram_downloads")
          if SUBFOLDER:
              BASE_DIR = BASE_DIR / SUBFOLDER
          BASE_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }

          # ── Parse links ─────────────────────────────────────────
          def parse_links(raw):
              text = raw.replace(',', '\n').replace(' ', '\n')
              lines = text.splitlines()
              links = []
              for line in lines:
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith('http'):
                      links.append(line)
                  elif 't.me/' in line:
                      links.append('https://' + line.lstrip('/'))
              seen = set()
              unique = []
              for l in links:
                  if l not in seen:
                      seen.add(l)
                      unique.append(l)
              if len(unique) > 1000:
                  print(f"⚠️ بیش از 1000 لینک - فقط 1000 لینک اول")
                  unique = unique[:1000]
              print(f"✅ {len(unique)} لینک معتبر شناسایی شد")
              return unique

          # ── Sanitize filename ───────────────────────────────────
          def sanitize(name):
              if not name.isascii():
                  return os.urandom(8).hex() + (Path(name).suffix or ".bin")
              clean = re.sub(r'[^a-zA-Z0-9._\-]', '_', name)
              clean = re.sub(r'__+', '_', clean)
              return clean

          # ── Get post text for naming ────────────────────────────
          def get_post_text(channel, msg_id):
              try:
                  url = f"https://t.me/{channel}/{msg_id}?embed=1"
                  resp = requests.get(url, headers=HEADERS, timeout=15)
                  match = re.search(r'class="tgme_widget_message_text"[^>]*>(.*?)</div>', resp.text, re.DOTALL)
                  if match:
                      text = re.sub(r'<[^>]+>', '', match.group(1))
                      text = text.replace('&amp;', '&').replace('&lt;', '<').replace('&gt;', '>')
                      text = re.sub(r'[^a-zA-Z0-9\u0600-\u06FF\s]', '', text)
                      text = text.strip()[:60]
                      if text:
                          return text.replace(' ', '_')
              except:
                  pass
              return f"{channel}_{msg_id}"

          # ── Extract channel & msg_id from link ──────────────────
          def parse_tg_link(link):
              link = link.replace('https://t.me/', '').replace('http://t.me/', '').rstrip('/')
              parts = link.split('/')
              if len(parts) >= 2:
                  return parts[0], parts[1].split('?')[0]
              return parts[0], "0"

          # ── Download file with resume ───────────────────────────
          def download_file(url, dest, max_retries=5):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              
              for attempt in range(max_retries):
                  try:
                      resp = requests.get(url, headers=HEADERS, stream=True, timeout=60)
                      resp.raise_for_status()
                      total = int(resp.headers.get('content-length', 0))
                      downloaded = 0
                      with open(dest, 'wb') as f:
                          for chunk in resp.iter_content(chunk_size=65536):
                              if chunk:
                                  f.write(chunk)
                                  downloaded += len(chunk)
                                  if total > 0:
                                      pct = downloaded / total * 100
                                      bar_len = 30
                                      filled = int(bar_len * downloaded // total)
                                      bar = '█' * filled + '░' * (bar_len - filled)
                                      print(f"\r   |{bar}| {pct:.0f}% ({downloaded}/{total})", end='', flush=True)
                      print()
                      if dest.stat().st_size > 0:
                          return True, dest.stat().st_size
                  except Exception as e:
                      print(f"\r   ⚠️ تلاش {attempt+1}: {str(e)[:50]}")
                      time.sleep(2 ** attempt)
              return False, 0

          # ── Extract all media URLs from Telegram embed page ─────
          def extract_media_urls(channel, msg_id):
              url = f"https://t.me/{channel}/{msg_id}?embed=1"
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=15)
                  html = resp.text
              except:
                  return [], None
              
              media_urls = []
              
              # Videos
              for m in re.finditer(r'<source src="([^"]+)"', html):
                  media_urls.append(m.group(1))
              
              # Document download links
              for m in re.finditer(r'class="tgme_widget_message_document_wrap"[^>]*href="([^"]+)"', html):
                  media_urls.append(m.group(1))
              
              # Photos - background images
              for m in re.finditer(r"url\('([^']+)'\)", html):
                  media_urls.append(m.group(1))
              
              # Photo/video wrap links
              for m in re.finditer(r'class="tgme_widget_message_(?:photo|video)_wrap"[^>]*href="([^"]+)"', html):
                  media_urls.append(m.group(1))
              
              # Any CDN file links (excluding CSS/JS/fonts)
              for m in re.finditer(r'https://cdn[^"<>\s]+\.(?:apk|pdf|zip|rar|7z|doc|docx|xls|xlsx|ppt|pptx|txt|exe|msi|dmg|iso|tar|gz|mp4|webm|mov|mkv|avi|mp3|ogg|wav|flac|aac|m4a|jpg|jpeg|png|webp|gif|bmp)[^"<>\s]*', html, re.I):
                  media_urls.append(m.group(0))
              
              # Any t.me file links
              for m in re.finditer(r'https://t\.me/[a-zA-Z0-9_/]+', html):
                  link = m.group(0)
                  if link not in media_urls and link != f"https://t.me/{channel}/{msg_id}":
                      media_urls.append(link)
              
              # Remove duplicates
              seen = set()
              unique_media = []
              for u in media_urls:
                  if u not in seen:
                      seen.add(u)
                      unique_media.append(u)
              
              post_text = get_post_text(channel, msg_id)
              return unique_media, post_text

          # ── Get extension from URL ──────────────────────────────
          def get_ext(url):
              for ext in ['apk', 'pdf', 'zip', 'rar', '7z', 'docx', 'doc', 'xlsx', 'xls',
                          'pptx', 'ppt', 'txt', 'exe', 'msi', 'dmg', 'iso', 'tar', 'gz',
                          'bz2', 'xz', 'mp4', 'webm', 'mov', 'mkv', 'avi', 'mp3', 'ogg',
                          'wav', 'flac', 'aac', 'm4a', 'opus', 'jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp']:
                  if f'.{ext}' in url.lower():
                      return ext
              return 'file'

          # ── Process one link ────────────────────────────────────
          def process_link(tg_link, base_dir):
              print(f"\n{'='*60}")
              print(f"🔗 {tg_link}")
              
              channel, msg_id = parse_tg_link(tg_link)
              print(f"📢 @{channel} | 📝 {msg_id}")
              
              media_urls, post_text = extract_media_urls(channel, msg_id)
              
              if not media_urls:
                  print("⚠️ هیچ فایلی در این پست یافت نشد")
                  return None, 0, "بدون فایل"
              
              print(f"🔍 {len(media_urls)} فایل یافت شد")
              
              downloaded = []
              for i, media_url in enumerate(media_urls, 1):
                  ext = get_ext(media_url)
                  if ext == 'jpeg':
                      ext = 'jpg'
                  
                  # Create filename from post text
                  if len(media_urls) == 1:
                      fname = f"{post_text}.{ext}"
                  else:
                      fname = f"{post_text}_{i}.{ext}"
                  
                  fname = sanitize(fname)
                  dest = base_dir / fname
                  
                  # Avoid overwrite
                  counter = 1
                  stem, suffix = dest.stem, dest.suffix
                  while dest.exists():
                      dest = base_dir / f"{stem}_{counter}{suffix}"
                      counter += 1
                  
                  print(f"\n⬇️ [{i}/{len(media_urls)}] {dest.name}")
                  
                  success, size = download_file(media_url, dest)
                  
                  if success:
                      size_mb = size / 1_048_576
                      print(f"   ✅ {size_mb:.1f} MB")
                      
                      # Split if needed
                      if SPLIT_MB > 0 and size > SPLIT_MB * 1_048_576:
                          print(f"   ✂️ تقسیم به قطعه‌های {SPLIT_MB}MB...")
                          zip_name = dest.with_suffix('.zip')
                          subprocess.run(
                              ['zip', '-0', '-s', f'{SPLIT_MB}m', str(zip_name), '-j', str(dest.name)],
                              cwd=dest.parent, check=True
                          )
                          dest.unlink()
                          for p in sorted(dest.parent.glob(f"{zip_name.stem}.z*")):
                              if p.exists():
                                  downloaded.append((p, p.stat().st_size))
                          if zip_name.exists():
                              downloaded.append((zip_name, zip_name.stat().st_size))
                      else:
                          downloaded.append((dest, size))
                  else:
                      print(f"   ❌ ناموفق")
                      if dest.exists() and dest.stat().st_size == 0:
                          dest.unlink()
              
              return downloaded, sum(s for _, s in downloaded), None

          # ── Main ────────────────────────────────────────────────
          def main():
              if not TEL_LINKS:
                  print("❌ هیچ لینکی وارد نشده")
                  sys.exit(1)
              
              links = parse_links(TEL_LINKS)
              if not links:
                  print("❌ لینک معتبر یافت نشد")
                  sys.exit(1)
              
              all_downloaded = []
              
              for link in links:
                  result, total_size, err = process_link(link, BASE_DIR)
                  if result:
                      all_downloaded.extend(result)
              
              if not all_downloaded:
                  print("\n❌ هیچ فایلی دانلود نشد!")
                  sys.exit(1)
              
              print(f"\n{'='*60}")
              print(f"🎉 {len(all_downloaded)} فایل با موفقیت دانلود شد")
              total_mb = sum(s for _, s in all_downloaded) / 1_048_576
              print(f"📦 حجم کل: {total_mb:.1f} MB")
              print(f"📁 مسیر: {BASE_DIR}")
              for f, s in all_downloaded:
                  print(f"   📄 {f.name} ({s/1_048_576:.1f} MB)")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: 📤 ارسال فایل‌ها به مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ ! -d "telegram_downloads" ] || [ -z "$(find telegram_downloads -type f ! -name '*.partial' 2>/dev/null)" ]; then
            echo "❌ هیچ فایلی برای ارسال وجود ندارد"
            exit 1
          fi
          
          echo "📤 ارسال فایل‌ها..."
          
          # Collect all files
          mapfile -t ALL_FILES < <(find telegram_downloads -type f ! -name "*.partial")
          TOTAL=${#ALL_FILES[@]}
          echo "📁 $TOTAL فایل برای ارسال"
          
          # Push in batches by size
          BATCH=()
          BATCH_SIZE=0
          MAX_BATCH_MB=100
          
          push_batch() {
            if [ ${#BATCH[@]} -eq 0 ]; then return; fi
            echo "📦 ارسال دسته (${BATCH_SIZE}MB, ${#BATCH[@]} فایل)..."
            git add "${BATCH[@]}"
            git commit -m "📩 Telegram download batch [skip ci]" 2>/dev/null || true
            
            for attempt in 1 2 3 4 5; do
              if timeout 120 git push origin "${GITHUB_REF_NAME}"; then
                echo "   ✅ دسته ارسال شد"
                return 0
              fi
              echo "   ⚠️ تلاش $attempt ناموفق..."
              sleep 5
            done
            echo "   ❌ ارسال دسته ناموفق"
            return 1
          }
          
          for file in "${ALL_FILES[@]}"; do
            SIZE=$(( $(stat -c%s "$file" 2>/dev/null || echo 0) / 1048576 ))
            if [ $((BATCH_SIZE + SIZE)) -gt $MAX_BATCH_MB ] && [ ${#BATCH[@]} -gt 0 ]; then
              push_batch
              BATCH=()
              BATCH_SIZE=0
            fi
            BATCH+=("$file")
            BATCH_SIZE=$((BATCH_SIZE + SIZE))
          done
          
          push_batch
          
          echo ""
          echo "=========================================="
          echo "✅ تمام فایل‌ها با موفقیت ارسال شدند!"
          echo "=========================================="
