name: 03 - 📩 دانلودر تلگرام

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: '🔗 لینک پست تلگرام (مثال: https://t.me/channel/123)'
        required: true
        type: string

jobs:
  tg-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: بررسی لینک تلگرام
        run: |
          if [ -z "${{ github.event.inputs.telegram_link }}" ]; then
            echo "❌ لینک تلگرام وارد نشده است!"
            exit 1
          fi
          echo "✅ لینک تلگرام دریافت شد"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --upgrade pip

      - name: دانلود از تلگرام با استفاده از کد استخراج شده
        run: |
          TELEGRAM_LINK="${{ github.event.inputs.telegram_link }}"
          
          # Extract channel and message ID
          CHANNEL=$(echo "$TELEGRAM_LINK" | sed 's|https://t.me/||' | sed 's|http://t.me/||' | cut -d'/' -f1)
          MSG_ID=$(echo "$TELEGRAM_LINK" | sed 's|https://t.me/||' | sed 's|http://t.me/||' | cut -d'/' -f2 | sed 's|?.*||')
          
          BACKUP_DIR="/tmp/telegram_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          FOLDER_NAME="telegram_${CHANNEL}_${MSG_ID}"
          DOWNLOAD_PATH="${BACKUP_DIR}/${FOLDER_NAME}"
          
          echo "📩 Telegram Downloader (Extracted from av6387 bot)"
          echo "🔗 Link: $TELEGRAM_LINK"
          echo "📢 Channel: $CHANNEL"
          echo "📝 Message ID: $MSG_ID"
          echo ""
          
          # Save the Python script
          cat > telegram_downloader.py << 'EOF'
# Paste the entire Python script from above here
EOF
          
          # Run the downloader
          python3 telegram_downloader.py "$CHANNEL" "$MSG_ID" "$DOWNLOAD_PATH"
          
          DOWNLOAD_STATUS=$?
          
          # Save folder name for next step
          echo "$FOLDER_NAME" > /tmp/folder_name.txt
          
          if [ $DOWNLOAD_STATUS -eq 0 ]; then
            echo "✅ Download completed successfully"
          else
            echo "⚠️ Download completed with issues"
          fi

      - name: ذخیره‌سازی فایل‌های دانلود شده در GitHub
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          echo "📤 Saving downloaded files to repository..."
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          FOLDER_NAME=$(cat /tmp/folder_name.txt)
          
          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR/$FOLDER_NAME" -type f -not -name "README.md" 2>/dev/null | wc -l)
          
          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "❌ No files were downloaded!"
            exit 1
          fi
          
          echo "📁 Total files to push: $BACKUP_FILE_COUNT"
          
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH" 2>/dev/null || true
          
          mkdir -p telegram_downloads
          cp -r "$BACKUP_DIR"/* telegram_downloads/
          
          # Create a README for the download
          cat > "telegram_downloads/${FOLDER_NAME}/README.md" << EOF
# 📩 Telegram Download: ${CHANNEL}/${MSG_ID}

## 📋 Information
- **Channel:** @${CHANNEL}
- **Message ID:** ${MSG_ID}
- **Original Link:** [View Post](${{ github.event.inputs.telegram_link }})
- **Download Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')

## 📁 Downloaded Files
EOF
          
          # List files in README
          cd "$BACKUP_DIR/$FOLDER_NAME"
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "README.md" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || echo 0)
              size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
              echo "- **$file** (${size_mb} MB)" >> "../../../telegram_downloads/${FOLDER_NAME}/README.md"
            fi
          done
          cd - > /dev/null
          
          echo "" >> "telegram_downloads/${FOLDER_NAME}/README.md"
          echo "Files are available in this directory" >> "telegram_downloads/${FOLDER_NAME}/README.md"
          
          git add -A telegram_downloads/
          
          if git diff --cached --quiet; then
            echo "✅ No new changes to commit"
          else
            git commit -m "📩 Telegram download: ${{ github.event.inputs.telegram_link }} [skip ci]"
            
            # Push with retry
            for i in {1..5}; do
              if git push origin HEAD:"$BRANCH"; then
                echo "✅ Successfully pushed to GitHub!"
                break
              fi
              echo "⚠️ Push failed, retry $i/5..."
              sleep 5
              git pull origin "$BRANCH" --rebase 2>/dev/null || true
            done
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Download completed successfully!"
          echo "📁 Files saved in: telegram_downloads/${FOLDER_NAME}/"
          echo "=========================================="
