---
name: 03 - 📩 دانلودر تلگرام

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: '🔗 لینک پست تلگرام (مثال: https://t.me/channel/123)'
        required: true
        type: string

jobs:
  tg-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: بررسی لینک تلگرام
        run: |
          if [ -z "${{ github.event.inputs.telegram_link }}" ]; then
            echo ""
            echo "❌ لینک تلگرام وارد نشده است!"
            echo ""
            echo "📌 راهنما:"
            echo "   1️⃣ workflow را دوباره اجرا کنید"
            echo "   2️⃣ در فیلد 'لینک پست تلگرام' آدرس پست را وارد کنید"
            echo "   3️⃣ مثال: https://t.me/channel_name/123"
            echo ""
            exit 1
          fi
          echo "✅ لینک تلگرام دریافت شد"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget zip bc

      - name: دانلود فایل از تلگرام
        run: |
          TELEGRAM_LINK="${{ github.event.inputs.telegram_link }}"
          
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          
          mkdir -p telegram_downloads
          
          echo "📩 Telegram Downloader"
          echo "🔗 Link: $TELEGRAM_LINK"
          echo ""

          # Extract channel and message ID
          CLEAN_LINK=$(echo "$TELEGRAM_LINK" | sed 's|https://t.me/||' | sed 's|http://t.me/||' | sed 's|/$||')
          CHANNEL=$(echo "$CLEAN_LINK" | cut -d'/' -f1)
          MSG_ID=$(echo "$CLEAN_LINK" | cut -d'/' -f2 | sed 's|?.*||')
          
          echo "📢 Channel: @$CHANNEL"
          echo "📝 Message ID: $MSG_ID"
          echo ""

          # Fetch the Telegram page
          EMBED_URL="https://t.me/${CHANNEL}/${MSG_ID}?embed=1"
          echo "📥 Fetching: $EMBED_URL"
          
          curl -sL -o /tmp/telegram_page.html \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$EMBED_URL"
          
          if [ ! -s /tmp/telegram_page.html ]; then
            echo "❌ Failed to fetch page"
            exit 1
          fi
          
          echo "✅ Page fetched"
          echo ""

          # Get post text for naming
          POST_TEXT=$(grep -oP 'class="tgme_widget_message_text"[^>]*>\K[^<]+' /tmp/telegram_page.html | head -1 | sed 's/<[^>]*>//g' | tr -d '\n\r' | tr ' ' '_' | tr -c 'a-zA-Z0-9_\-\.' '_' | sed 's/__*/_/g' | sed 's/^_//' | sed 's/_$//' | cut -c1-50 || echo "${CHANNEL}_${MSG_ID}")
          
          if [ -z "$POST_TEXT" ]; then
            POST_TEXT="${CHANNEL}_${MSG_ID}"
          fi
          
          echo "📝 Post name: $POST_TEXT"
          echo ""

          DOWNLOADED=0

          # ----- DOWNLOAD ALL MEDIA FILES FROM THE POST -----
          
          # 1. Extract and download the MAIN file/link from the post
          # Telegram CDN files (documents, APK, ZIP, etc.)
          echo "🔍 Searching for files..."
          
          # Find document download links
          grep -oP 'href="https://t\.me/[^"]+' /tmp/telegram_page.html > /tmp/all_links.txt
          grep -oP 'https://cdn[^"<> ]+' /tmp/telegram_page.html | grep -vE '\.(css|js|ico|svg|woff|woff2)' >> /tmp/all_links.txt
          grep -oP 'https://[^"<> ]+\.(apk|pdf|zip|rar|7z|doc|docx|xls|xlsx|ppt|pptx|txt|exe|msi|dmg|iso|tar|gz|bz2|xz|epub|mobi|deb|rpm|torrent|magnet)[^"<> ]*' /tmp/telegram_page.html >> /tmp/all_links.txt
          
          # Find video sources
          grep -oP '<source src="[^"]+"' /tmp/telegram_page.html | grep -oP 'https://[^"]+' >> /tmp/all_links.txt
          grep -oP 'https://[^"<> ]+\.(mp4|webm|mov|mkv|avi)[^"<> ]*' /tmp/telegram_page.html >> /tmp/all_links.txt
          
          # Find images
          grep -oP 'https://cdn[^"<> ]+\.(jpg|jpeg|png|webp|gif)[^"<> ]*' /tmp/telegram_page.html >> /tmp/all_links.txt
          grep -oP "url\('(https://[^']+)'\)" /tmp/telegram_page.html | sed "s/url('//" | sed "s/')//" >> /tmp/all_links.txt
          
          # Find audio
          grep -oP 'https://[^"<> ]+\.(mp3|ogg|wav|flac|aac|m4a|opus)[^"<> ]*' /tmp/telegram_page.html >> /tmp/all_links.txt
          
          # Sort and remove duplicates
          sort -u /tmp/all_links.txt > /tmp/unique_links.txt
          
          # Download each file
          FILE_COUNT=0
          while IFS= read -r FILE_URL; do
            [ -z "$FILE_URL" ] && continue
            FILE_COUNT=$((FILE_COUNT + 1))
            
            # Get original filename and extension
            RAW_NAME=$(basename "$FILE_URL" | sed 's|?.*||' | sed 's|#.*||')
            EXT="${RAW_NAME##*.}"
            
            # Skip if no extension
            [ -z "$EXT" ] && EXT="file"
            
            # Use post text as filename, keep original extension
            if [ $FILE_COUNT -eq 1 ]; then
              FILE_NAME="${POST_TEXT}.${EXT}"
            else
              FILE_NAME="${POST_TEXT}_${FILE_COUNT}.${EXT}"
            fi
            
            echo "⬇️ [${FILE_COUNT}] Downloading: $FILE_NAME"
            
            curl -sL -o "telegram_downloads/${FILE_NAME}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Referer: https://t.me/" \
              --max-time 600 \
              "$FILE_URL"
            
            if [ -f "telegram_downloads/${FILE_NAME}" ] && [ -s "telegram_downloads/${FILE_NAME}" ]; then
              SIZE=$(stat -c%s "telegram_downloads/${FILE_NAME}" 2>/dev/null || echo 0)
              SIZE_MB=$(( SIZE / 1024 / 1024 ))
              echo "   ✅ Saved (${SIZE_MB} MB)"
              DOWNLOADED=$((DOWNLOADED + 1))
            else
              rm -f "telegram_downloads/${FILE_NAME}"
              echo "   ⚠️ Empty or failed"
            fi
          done < /tmp/unique_links.txt
          
          # Cleanup
          rm -f /tmp/telegram_page.html /tmp/all_links.txt /tmp/unique_links.txt
          
          echo ""
          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "❌ No files downloaded!"
            exit 1
          else
            echo "=========================================="
            echo "✅ Downloaded $DOWNLOADED file(s)"
            ls -lh telegram_downloads/
            echo "=========================================="
          fi

      - name: ذخیره‌سازی فایل‌ها
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          echo "📤 Pushing files..."
          
          if [ -z "$(ls -A telegram_downloads 2>/dev/null)" ]; then
            echo "❌ No files to push"
            exit 1
          fi
          
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"
          
          git add -A telegram_downloads/
          
          if ! git diff --cached --quiet; then
            git commit -m "📩 Telegram: ${{ github.event.inputs.telegram_link }} [skip ci]"
            
            RETRY=0
            while [ $RETRY -lt 10 ]; do
              RETRY=$((RETRY + 1))
              if timeout 300 git push origin HEAD:"$BRANCH"; then
                echo "✅ Push successful!"
                break
              else
                echo "⚠️ Push failed, retry $RETRY/10..."
                sleep 5
                git fetch origin "$BRANCH"
                git reset --hard origin/"$BRANCH"
                git add -A telegram_downloads/
                git diff --cached --quiet || git commit -m "📩 Telegram [skip ci]"
              fi
            done
          else
            echo "No changes to push"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Done!"
          echo "=========================================="
