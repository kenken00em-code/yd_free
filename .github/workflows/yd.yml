name: 02 - 🎬 دانلود یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '🔗 لینک ویدیو ( چند لینک با فاصله )'
        required: true
        type: string
      download_subtitles:
        description: '📝 زیرنویس ( فارسی و انگلیسی )'
        required: false
        default: false
        type: boolean
      quality:
        description: '🎬 کیفیت و نوع'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: '🔒 رمز ( اختیاری برای محافظت )'
        required: false
        default: ''
        type: string

env:
  YT_URLS: ${{ github.event.inputs.video_urls }}
  YT_QUALITY: ${{ github.event.inputs.quality }}
  YT_PASSWORD: ${{ github.event.inputs.password }}
  YT_SUBS: ${{ github.event.inputs.download_subtitles }}
  # Optional: Netscape-format cookies.txt saved as a repo secret named YT_COOKIES.
  # Only needed if YouTube still blocks the runner after the PO-token fix.
  YT_COOKIES: ${{ secrets.YT_COOKIES }}
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  BRANCH: ${{ github.ref_name }}

jobs:
  get-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: بررسی اولیه
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: آماده سازی گیت برای فایلهای بزرگ
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: شروع کانتینر
        run: |
          echo "Starting Cloudflare WARP container..."

          docker network create warp-net || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15

          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              echo "$RESULT"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "WARP proxy is ready!"
          else
            echo "WARP might not be fully active, but continuing anyway..."
            echo "Response: $FINAL"
          fi

      # ──────────────────────────────────────────────────────────────────────
      # THE 360p FIX: YouTube now forces SABR streaming and only hands out
      # 720p/1080p+ to clients that present a PO token. Without one, every
      # client collapses to format 18 (360p). This local server mints the
      # tokens; the bgutil yt-dlp plugin finds it automatically on :4416.
      # ──────────────────────────────────────────────────────────────────────
      - name: شروع سرور توکن ( PO Token )
        run: |
          docker run -d \
            --name bgutil-pot \
            --restart=always \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider

          for i in {1..20}; do
            if curl -sf --max-time 3 http://127.0.0.1:4416/ping > /dev/null; then
              echo "PO token server is up!"
              break
            fi
            echo "Waiting for PO token server ($i/20)..."
            sleep 2
          done

          if ! curl -sf --max-time 3 http://127.0.0.1:4416/ping > /dev/null; then
            echo "::warning::PO token server did not answer on :4416 - high quality may be unavailable"
            docker logs bgutil-pot 2>&1 | tail -20 || true
          fi

      - name: نصب پیش نیازها
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip unzip curl jq bc

          # Deno = JS runtime yt-dlp needs to solve YouTube's signature / n challenges
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> "$GITHUB_PATH"
          deno --version

          # yt-dlp nightly (YouTube changes weekly) + [default] extras (bundles yt-dlp-ejs
          # challenge solver) + the PO token plugin that talks to the server started above
          PKGS=(--upgrade --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider)
          pip3 install "${PKGS[@]}" || pip3 install --break-system-packages "${PKGS[@]}"

          echo "---- versions ----"
          yt-dlp --version
          pip3 list 2>/dev/null | grep -Ei "yt-dlp|bgutil" || true

      - name: دانلود تنظیمات
        run: |
          mkdir -p /tmp/stage /tmp/video_backup videos
          : > /tmp/video_info.txt

          # URLs: split on any whitespace, drop blanks and duplicates
          printf '%s' "$YT_URLS" | tr -s '[:space:]' '\n' | sed '/^$/d' | awk '!seen[$0]++' > /tmp/yt_urls.txt
          TOTAL_URLS=$(wc -l < /tmp/yt_urls.txt)
          if [ "$TOTAL_URLS" -eq 0 ]; then
            echo "::error::No video URL provided"
            exit 1
          fi

          # Optional cookies
          rm -f /tmp/yt_cookies.txt
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
          fi

          echo "YouTube Video Downloader"
          echo ""
          echo "Total URLs to download: $TOTAL_URLS"
          echo "Quality: $YT_QUALITY"
          if [ -n "$YT_PASSWORD" ]; then echo "Password protection: ENABLED"; else echo "Password protection: DISABLED"; fi
          if [ "$YT_SUBS" = "true" ]; then echo "Subtitles: ENABLED (en, fa)"; else echo "Subtitles: DISABLED"; fi
          if [ -s /tmp/yt_cookies.txt ]; then echo "Cookies: PROVIDED"; else echo "Cookies: none"; fi
          if [ "$TOTAL_URLS" -gt 1 ]; then echo "Output: ONE combined zip for all videos"; fi
          echo ""

          # ────────────────────────────────────────────────────────────────
          # Shared helpers, sourced by every later step
          # ────────────────────────────────────────────────────────────────
          cat > /tmp/yt_lib.sh <<'YTLIB'
          export PATH="$HOME/.deno/bin:$PATH"
          export LC_ALL=C.UTF-8

          STAGE=/tmp/stage                # raw downloads, one sub-folder per video
          BACKUP_DIR=/tmp/video_backup    # final folders that get pushed to git
          SPLIT_MB=90
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          PROXY_URL="socks5://127.0.0.1:1080"
          BT='`'
          MEDIA_FIND=( \( -name '*.mp4' -o -name '*.mkv' -o -name '*.webm' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.opus' \) )

          # id | proxy/direct | youtube player_client list
          # mweb + PO token is the setup yt-dlp's own PO-Token guide recommends.
          YT_METHODS=(
            "1|proxy|mweb"
            "2|direct|mweb"
            "3|proxy|default,mweb"
            "4|proxy|tv"
            "5|proxy|web_safari"
            "6|proxy|web_creator"
            "7|direct|default,mweb,tv"
            "8|proxy|android_vr"
          )

          sanitize_name() { echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-'; }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          normalize_youtube_url() {
            local INPUT_URL="$1" VIDEO_ID
            if [[ "$INPUT_URL" =~ youtu\.be/([a-zA-Z0-9_-]+) ]]; then
              VIDEO_ID="${BASH_REMATCH[1]}"
              echo "https://www.youtube.com/watch?v=${VIDEO_ID}"
            else
              echo "$INPUT_URL"
            fi
          }

          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")
          get_random_word() { echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"; }

          get_unique_folder() {
            local NAME="$1" CAND="$1"
            while [ -d "videos/$CAND" ] || [ -d "$BACKUP_DIR/$CAND" ]; do
              CAND="${NAME}_$(get_random_word)"
            done
            echo "$CAND"
          }

          # ---- yt-dlp argument builders ----------------------------------
          YT_ARGS=()
          build_args() {
            local ID="$1" LINE MID MODE CLIENTS
            for LINE in "${YT_METHODS[@]}"; do
              IFS='|' read -r MID MODE CLIENTS <<< "$LINE"
              if [ "$MID" = "$ID" ]; then
                YT_ARGS=( --extractor-args "youtube:player_client=${CLIENTS}" --js-runtimes deno --remote-components ejs:github )
                if [ "$MODE" = "proxy" ]; then YT_ARGS+=( --proxy "$PROXY_URL" ); fi
                if [ -s /tmp/yt_cookies.txt ]; then YT_ARGS+=( --cookies /tmp/yt_cookies.txt ); fi
                return 0
              fi
            done
            return 1
          }

          # -f "bv*+ba/b" (separate video+audio first); -S res:N = "closest to N, never above if possible".
          # (The old selector contained the invalid pattern "bestvideo[height<=N]*", and had no way to ask for "highest <= N" cleanly.)
          YT_FMT=()
          case "$YT_QUALITY" in
            audio)   YT_FMT=( -f "bestaudio/best" ) ;;
            best)    YT_FMT=( -f "bv*+ba/b" ) ;;
            *[0-9]*) YT_FMT=( -f "bv*+ba/b" -S "res:${YT_QUALITY}" ) ;;
            *)       YT_FMT=( -f "bv*+ba/b" ) ;;
          esac

          YT_COMMON=( --no-playlist --no-part --retries 5 --fragment-retries 5 --no-check-certificates
                      --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline )

          # Print the quality tier (e.g. 1080) that a method WOULD download, without downloading.
          # 360p muxed fallback = 360. Failure = 0. Works for portrait, 4:3 and cinemascope videos too.
          probe_height() {
            local ID="$1" URL="$2" OUT W H LONG SHORT EFF
            if ! build_args "$ID"; then echo 0; return 0; fi
            OUT=$(yt-dlp "${YT_ARGS[@]}" "${YT_FMT[@]}" --no-playlist --print "%(width)s %(height)s" "$URL" 2>/tmp/probe_err.txt | tail -n 1)
            read -r W H <<< "$OUT"
            if [[ "$W" =~ ^[0-9]+$ ]] && [[ "$H" =~ ^[0-9]+$ ]]; then
              if [ "$W" -ge "$H" ]; then LONG=$W; SHORT=$H; else LONG=$H; SHORT=$W; fi
              EFF=$(( LONG * 9 / 16 ))
              if [ "$SHORT" -gt "$EFF" ]; then EFF=$SHORT; fi
              echo "$EFF"
            else
              echo 0
            fi
            return 0
          }

          download_with() {
            local ID="$1" URL="$2" DIR="$3"
            build_args "$ID" || return 1
            mkdir -p "$DIR"
            local EXTRA=( --write-thumbnail --convert-thumbnails jpg --output "$DIR/%(title)s.%(ext)s" )
            if [ "$YT_QUALITY" = "audio" ]; then
              EXTRA+=( --extract-audio --audio-format mp3 --audio-quality 0 )
            else
              EXTRA+=( --merge-output-format mp4 )
            fi
            yt-dlp "${YT_ARGS[@]}" "${YT_FMT[@]}" "${YT_COMMON[@]}" "${EXTRA[@]}" "$URL"
          }

          list_media() { find "$1" -maxdepth 1 -type f "${MEDIA_FIND[@]}" | sort; }

          # ---- packaging helpers -----------------------------------------
          # zip everything in $1 into $2.zip (split into 90MB parts when bigger). Uses -0 (store): video is already compressed.
          create_archive() {
            local SRC="$1" BASE="$2" TOTAL
            local ARGS=( -0 -r -q )
            TOTAL=$(du -sb "$SRC" | cut -f1)
            if [ -n "$YT_PASSWORD" ]; then ARGS+=( -P "$YT_PASSWORD" ); fi
            if [ "$TOTAL" -gt "$SPLIT_BYTES" ]; then ARGS+=( -s "${SPLIT_MB}m" ); fi
            ( cd "$SRC" && zip "${ARGS[@]}" "${BASE}.zip" . )
          }

          list_parts() { ls -1 "$1/$2.zip" "$1/$2".z[0-9]* 2>/dev/null | sort -V; }

          extract_md() {
            local Z="$1" SPLIT="$2" PW=""
            if [ -n "$YT_PASSWORD" ]; then PW=" → enter password"; fi
            echo "## How to Extract"
            echo ""
            if [ "$SPLIT" = "yes" ]; then
              echo "Download **all parts** into the **same folder**, then open ${BT}${Z}${BT} — the other parts are found automatically (Windows: use [7-Zip](https://www.7-zip.org/) or WinRAR)."
              echo ""
            fi
            echo "| OS | Steps |"
            echo "|----|-------|"
            echo "| **Windows** | Open ${BT}${Z}${BT} with [7-Zip](https://www.7-zip.org/) or WinRAR → Extract${PW} |"
            echo "| **Mac** | Open with [Keka](https://www.keka.io/) or The Unarchiver${PW} |"
            if [ "$SPLIT" = "yes" ]; then
              echo "| **Linux** | ${BT}7z x ${Z}${BT} (needs p7zip; plain ${BT}unzip${BT} cannot open split archives)${PW} |"
            else
              echo "| **Linux** | ${BT}unzip ${Z}${BT} or ${BT}7z x ${Z}${BT}${PW} |"
            fi
            echo "| **Android** | [ZArchiver](https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver) → tap ${BT}${Z}${BT}${PW} |"
          }
          YTLIB

          echo "Setup complete."

      - name: دانلود ویدیو
        run: |
          set +e
          source /tmp/yt_lib.sh
          mapfile -t URL_LIST < /tmp/yt_urls.txt
          TOTAL_URLS=${#URL_LIST[@]}

          # What counts as "good enough" (effective height in px)
          if [ "$YT_QUALITY" = "audio" ]; then
            MIN_OK=0
          elif [ "$YT_QUALITY" = "best" ]; then
            MIN_OK=700
          else
            MIN_OK=$(( YT_QUALITY * 9 / 10 ))
          fi

          IDX=0
          for RAW_URL in "${URL_LIST[@]}"; do
            IDX=$((IDX + 1))
            URL=$(normalize_youtube_url "$RAW_URL")

            echo ""
            echo "============================================================"
            echo "Processing URL $IDX / $TOTAL_URLS : $URL"
            echo "============================================================"

            WORK="$STAGE/$IDX"
            rm -rf "$WORK"
            mkdir -p "$WORK"

            echo "Checking available formats..."
            build_args 1
            yt-dlp "${YT_ARGS[@]}" -F "$URL" || echo "Could not list formats (will proceed anyway)"
            echo ""

            # ── 1) PROBE: ask every method what quality it would deliver (no download yet) ──
            CANDIDATES=()
            if [ "$YT_QUALITY" = "audio" ]; then
              CANDIDATES=(1 2 3 4 5 6 7 8)
            else
              unset PH
              declare -A PH
              for ID in 1 2 3 4 5 6 7 8; do
                H=$(probe_height "$ID" "$URL")
                PH[$ID]=$H
                echo "  probe method $ID -> ${H}p"
                if [ "$H" -eq 0 ]; then
                  tail -n 2 /tmp/probe_err.txt | sed 's/^/      /'
                fi
                if [ "$H" -gt 0 ] && [ "$H" -ge "$MIN_OK" ]; then
                  CANDIDATES+=("$ID")
                  break
                fi
              done

              # then every other working method, best quality first
              SORTED=$(for ID in "${!PH[@]}"; do echo "${PH[$ID]} $ID"; done | sort -k1,1nr -k2,2n | awk '$1>0{print $2}')
              for ID in $SORTED; do
                if [[ " ${CANDIDATES[*]} " != *" $ID "* ]]; then CANDIDATES+=("$ID"); fi
              done

              if [ ${#CANDIDATES[@]} -eq 0 ]; then
                echo "⚠️  No method could even list a video format - trying real downloads anyway"
                CANDIDATES=(1 2 3 4 5 6 7 8)
              fi
            fi

            # ── 2) DOWNLOAD with the best method; fall through the list if it fails ──
            GOT=false
            USED=""
            for ID in "${CANDIDATES[@]}"; do
              rm -rf "$WORK/dl"
              echo ""
              echo "⬇️  Downloading with method $ID ..."
              download_with "$ID" "$URL" "$WORK/dl"
              find "$WORK/dl" -name "*.part" -delete 2>/dev/null
              if [ -n "$(list_media "$WORK/dl")" ]; then
                GOT=true
                USED=$ID
                break
              fi
              echo "Method $ID failed, waiting 3 seconds before next attempt..."
              sleep 3
            done

            if [ "$GOT" = false ]; then
              echo "❌ All download methods failed for URL: $URL — skipping."
              rm -rf "$WORK"
              continue
            fi

            # ── 3) Report what we really got (informational: we keep the best we could get) ──
            if [ "$YT_QUALITY" != "audio" ]; then
              FIRST=$(list_media "$WORK/dl" | head -1)
              GOT_DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$FIRST" 2>/dev/null)
              echo "Requested: $YT_QUALITY | Delivered by method $USED: ${GOT_DIM/,/x}"
              GW=${GOT_DIM%%,*}; GH=${GOT_DIM##*,}
              if [[ "$GW" =~ ^[0-9]+$ ]] && [[ "$GH" =~ ^[0-9]+$ ]]; then
                if [ "$GW" -ge "$GH" ]; then GL=$GW; GS=$GH; else GL=$GH; GS=$GW; fi
                GE=$(( GL * 9 / 16 )); if [ "$GS" -gt "$GE" ]; then GE=$GS; fi
                if [ "$GE" -lt "$MIN_OK" ]; then
                  echo "::warning::$URL - wanted $YT_QUALITY but the best available was ${GE}p (kept anyway)"
                else
                  echo "✅ Quality OK (${GE}p)"
                fi
              fi
            fi

            # ── 4) Move into the staging layout ──
            mkdir -p "$WORK/media"
            list_media "$WORK/dl" | while IFS= read -r F; do mv "$F" "$WORK/media/"; done
            THUMB=$(find "$WORK/dl" -maxdepth 1 -type f -name '*.jpg' | head -1)
            if [ -n "$THUMB" ]; then mv "$THUMB" "$WORK/thumbnail.jpg"; fi
            rm -rf "$WORK/dl"

            TITLE=$(basename "$(list_media "$WORK/media" | head -1)")
            TITLE="${TITLE%.*}"
            TITLE=$(sanitize_name "$TITLE")
            TITLE="${TITLE//|/-}"
            echo "${IDX}|${TITLE}|${URL}" >> /tmp/video_info.txt

            echo "✅ Finished URL $IDX / $TOTAL_URLS  ($(du -sh "$WORK/media" | cut -f1))"
          done

          echo ""
          echo "===== Downloaded ====="
          cat /tmp/video_info.txt

      - name: دانلود زیرنویس ها
        if: ${{ github.event.inputs.download_subtitles == 'true' }}
        run: |
          # Subtitle failures must NEVER stop the video from being pushed
          set +e
          source /tmp/yt_lib.sh

          sub_download() {
            local MODE="$1" OUT="$2" SURL="$3" ID SUB_DIR SFLAGS
            SUB_DIR=$(dirname "$OUT")
            case $MODE in
              all)       SFLAGS=( --write-sub --sub-langs "fa,en" ) ;;
              auto-both) SFLAGS=( --write-auto-sub --sub-langs "en,fa" ) ;;
            esac
            local COMMON_SUB=( --sub-format "vtt/srt/best" --convert-subs vtt --skip-download --no-playlist --no-check-certificates --output "$OUT" )

            for ID in 1 2 3 4 5 6 7 8; do
              echo "  [subtitle] method $ID ..."
              build_args "$ID" || continue
              yt-dlp "${YT_ARGS[@]}" "${SFLAGS[@]}" "${COMMON_SUB[@]}" "$SURL" 2>&1 || true

              local ANY EN FA
              ANY=$(find "$SUB_DIR" -type f \( -name "*.vtt" -o -name "*.srt" \) 2>/dev/null | wc -l)
              EN=$(find "$SUB_DIR" -type f \( -name "*.en.vtt" -o -name "*.en.srt" \) 2>/dev/null | wc -l)
              FA=$(find "$SUB_DIR" -type f \( -name "*.fa.vtt" -o -name "*.fa.srt" \) 2>/dev/null | wc -l)
              if [ "$MODE" = "auto-both" ]; then
                if [ "$EN" -gt 0 ] && [ "$FA" -gt 0 ]; then echo "  [subtitle] ✅ en+fa downloaded (method $ID)"; return 0; fi
              else
                if [ "$ANY" -gt 0 ]; then echo "  [subtitle] ✅ success (method $ID)"; return 0; fi
              fi
              sleep 1
            done
            return 1
          }

          while IFS='|' read -r IDX NAME URL; do
            [ -z "$IDX" ] && continue
            SUBTITLE_DIR="$STAGE/$IDX/subtitle"
            mkdir -p "$SUBTITLE_DIR"
            OUT_TMPL="${SUBTITLE_DIR}/%(title)s"

            echo ""
            echo "============================================================"
            echo "Downloading subtitles for: $NAME"
            echo "============================================================"

            sub_download "all" "$OUT_TMPL" "$URL" || true

            EN_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.en.vtt" -o -name "*.en.srt" \) 2>/dev/null | wc -l)
            FA_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.fa.vtt" -o -name "*.fa.srt" \) 2>/dev/null | wc -l)
            if [ "$EN_COUNT" -eq 0 ] || [ "$FA_COUNT" -eq 0 ]; then
              sub_download "auto-both" "$OUT_TMPL" "$URL" || true
            fi

            if [ "$(find "$SUBTITLE_DIR" -type f 2>/dev/null | wc -l)" -eq 0 ]; then
              rmdir "$SUBTITLE_DIR" 2>/dev/null
            fi
          done < /tmp/video_info.txt

          echo "✅ Subtitle step completed"
          exit 0

      - name: بسته بندی
        run: |
          source /tmp/yt_lib.sh

          mkdir -p "$BACKUP_DIR"
          mapfile -t INFO < /tmp/video_info.txt
          COUNT=${#INFO[@]}
          TOTAL_URLS=$(wc -l < /tmp/yt_urls.txt)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No video could be downloaded - every method failed for every URL."
            echo "If the log above shows 'Sign in to confirm you're not a bot', add a YT_COOKIES repository secret (cookies.txt from a logged-in browser)."
            exit 1
          fi
          if [ "$COUNT" -lt "$TOTAL_URLS" ]; then
            echo "::warning::Only $COUNT of $TOTAL_URLS videos were downloaded."
          fi

          if [ "$COUNT" -eq 1 ]; then
            # ═══════════════════════════════════════════════════════════════
            # ONE VIDEO  → its own folder (same layout as before)
            # ═══════════════════════════════════════════════════════════════
            IFS='|' read -r IDX NAME URL <<< "${INFO[0]}"
            SRC="$STAGE/$IDX"
            FOLDER=$(get_unique_folder "$NAME")
            DEST="$BACKUP_DIR/$FOLDER"
            mkdir -p "$DEST"
            RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/videos/$(urlencode "$FOLDER")"

            if [ -f "$SRC/thumbnail.jpg" ]; then cp "$SRC/thumbnail.jpg" "$DEST/thumbnail.jpg"; fi

            mapfile -t FILES < <(list_media "$SRC/media")
            FIRST_SIZE=$(stat -c%s "${FILES[0]}")
            SPLIT=no
            if [ "${#FILES[@]}" -eq 1 ] && [ -z "$YT_PASSWORD" ] && [ "$FIRST_SIZE" -le "$SPLIT_BYTES" ]; then
              EXT="${FILES[0]##*.}"
              MAIN="${FOLDER}.${EXT}"
              cp "${FILES[0]}" "$DEST/$MAIN"
              KIND="1 file (no split)"
            else
              create_archive "$SRC/media" "$DEST/$FOLDER"
              MAIN="${FOLDER}.zip"
              KIND="archive"
            fi

            if [ -d "$SRC/subtitle" ] && [ -n "$(ls -A "$SRC/subtitle" 2>/dev/null)" ]; then
              ( cd "$SRC/subtitle" && zip -j -q "$DEST/subtitle.zip" ./* )
            fi

            PART_COUNT=0; TOTAL_BYTES=0; LINKS=""
            if [ "$MAIN" = "${FOLDER}.zip" ]; then
              while IFS= read -r P; do
                [ -f "$P" ] || continue
                B=$(basename "$P")
                PART_COUNT=$((PART_COUNT + 1))
                TOTAL_BYTES=$((TOTAL_BYTES + $(stat -c%s "$P")))
                LINKS+="| ${PART_COUNT} | ${BT}${B}${BT} | [Download](${RAW_BASE}/$(urlencode "$B")) |"$'\n'
              done < <(list_parts "$DEST" "$FOLDER")
              if [ "$PART_COUNT" -gt 1 ]; then SPLIT=yes; fi
            else
              PART_COUNT=1
              TOTAL_BYTES=$FIRST_SIZE
              LINKS="| 1 | ${BT}${MAIN}${BT} | [Download](${RAW_BASE}/$(urlencode "$MAIN")) |"$'\n'
            fi
            TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1024 / 1024" | bc)
            if [ -n "$YT_PASSWORD" ]; then PWTXT="**YES**"; else PWTXT="**NO**"; fi

            {
              echo "# ${NAME}"
              echo ""
              if [ -f "$DEST/thumbnail.jpg" ]; then
                echo '<div align="center">'
                echo "  <img src=\"${RAW_BASE}/thumbnail.jpg\" alt=\"Video Thumbnail\" width=\"400\" />"
                echo '</div>'
                echo ""
                echo "<br>"
                echo ""
              fi
              echo "---"
              echo ""
              echo "## Video Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **Video Name** | ${BT}${NAME}${BT} |"
              echo "| **Original Link** | [YouTube Video](${URL}) |"
              if [ "$KIND" = "archive" ]; then
                echo "| **Total Size** | **${PART_COUNT} part(s)** - **${TOTAL_MB} MB** |"
              else
                echo "| **Total Size** | **${KIND}** - **${TOTAL_MB} MB** |"
              fi
              echo "| **Quality** | **${YT_QUALITY}** |"
              echo "| **Status** | **Complete (100%)** |"
              echo "| **Password Protected** | ${PWTXT} |"
              echo ""
              echo "---"
              echo ""
              echo "## Download Links"
              echo ""
              echo "| # | File | Link |"
              echo "|---|------|------|"
              printf '%s' "$LINKS"
              echo ""
              echo "---"
              echo ""
              if [ "$KIND" = "archive" ]; then
                extract_md "$MAIN" "$SPLIT"
              else
                echo "Ready to use — no extraction needed!"
              fi
              echo ""
              echo "---"
            } > "$DEST/README.md"

          else
            # ═══════════════════════════════════════════════════════════════
            # MULTIPLE VIDEOS → everything goes into ONE zip (+ thumbnails & README)
            # ═══════════════════════════════════════════════════════════════
            PACK="Pack_${COUNT}-videos_$(date -u +%Y%m%d-%H%M%S)"
            FOLDER=$(get_unique_folder "$PACK")
            DEST="$BACKUP_DIR/$FOLDER"
            PK="$STAGE/pack"
            rm -rf "$PK"
            mkdir -p "$PK" "$DEST/thumbnails"
            RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/videos/$(urlencode "$FOLDER")"

            ROWS=""
            HAS_SUBS=no
            N=0
            for LINE in "${INFO[@]}"; do
              IFS='|' read -r IDX NAME URL <<< "$LINE"
              SRC="$STAGE/$IDX"
              N=$((N + 1))
              NN=$(printf '%02d' "$N")
              SHORT="${NAME:0:100}"

              # videos:  01_Title.mp4, 02_Other-Title.mp4 ...
              while IFS= read -r F; do
                [ -f "$F" ] || continue
                B=$(basename "$F")
                mv "$F" "$PK/${NN}_$(sanitize_name "${SHORT}").${B##*.}"
              done < <(list_media "$SRC/media")

              # subtitles:  subtitles/01/*.vtt
              if [ -d "$SRC/subtitle" ] && [ -n "$(ls -A "$SRC/subtitle" 2>/dev/null)" ]; then
                mkdir -p "$PK/subtitles/$NN"
                mv "$SRC/subtitle/"* "$PK/subtitles/$NN/"
                HAS_SUBS=yes
              fi

              THUMB_MD="—"
              if [ -f "$SRC/thumbnail.jpg" ]; then
                cp "$SRC/thumbnail.jpg" "$DEST/thumbnails/${NN}.jpg"
                THUMB_MD="<img src=\"${RAW_BASE}/thumbnails/${NN}.jpg\" width=\"160\" />"
              fi
              ROWS+="| ${NN} | ${THUMB_MD} | ${NAME} | [YouTube](${URL}) |"$'\n'
            done

            echo "Packing ${COUNT} videos into one zip..."
            create_archive "$PK" "$DEST/$FOLDER"
            MAIN="${FOLDER}.zip"

            PART_COUNT=0; TOTAL_BYTES=0; LINKS=""
            while IFS= read -r P; do
              [ -f "$P" ] || continue
              B=$(basename "$P")
              PART_COUNT=$((PART_COUNT + 1))
              TOTAL_BYTES=$((TOTAL_BYTES + $(stat -c%s "$P")))
              LINKS+="| ${PART_COUNT} | ${BT}${B}${BT} | [Download](${RAW_BASE}/$(urlencode "$B")) |"$'\n'
            done < <(list_parts "$DEST" "$FOLDER")
            SPLIT=no
            if [ "$PART_COUNT" -gt 1 ]; then SPLIT=yes; fi
            TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1024 / 1024" | bc)
            if [ -n "$YT_PASSWORD" ]; then PWTXT="**YES**"; else PWTXT="**NO**"; fi

            {
              echo "# ${COUNT} Videos"
              echo ""
              echo "---"
              echo ""
              echo "## Videos In This Pack"
              echo ""
              echo "| # | Thumbnail | Title | Source |"
              echo "|---|-----------|-------|--------|"
              printf '%s' "$ROWS"
              echo ""
              echo "---"
              echo ""
              echo "## Pack Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **Videos** | **${COUNT}** (all inside one zip) |"
              echo "| **Total Size** | **${PART_COUNT} part(s)** - **${TOTAL_MB} MB** |"
              echo "| **Quality** | **${YT_QUALITY}** |"
              if [ "$HAS_SUBS" = "yes" ]; then
                echo "| **Subtitles** | Included in the zip, folder ${BT}subtitles/${BT} |"
              fi
              echo "| **Status** | **Complete (100%)** |"
              echo "| **Password Protected** | ${PWTXT} |"
              echo ""
              echo "---"
              echo ""
              echo "## Download Links"
              echo ""
              echo "| # | File | Link |"
              echo "|---|------|------|"
              printf '%s' "$LINKS"
              echo ""
              echo "---"
              echo ""
              extract_md "$MAIN" "$SPLIT"
              echo ""
              echo "---"
            } > "$DEST/README.md"
          fi

          echo ""
          echo "===== Backup folder contents ====="
          find "$BACKUP_DIR" -type f | head -50

      - name: متوقف کردن کانتینر
        if: always()
        run: |
          docker stop warp bgutil-pot || true
          docker rm warp bgutil-pot || true

      - name: ذخیره سازی دانلود شده ها
        run: |
          echo "YouTube Downloader - Incremental Push Mode"
          BACKUP_DIR=/tmp/video_backup
          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)

          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "No files to push. Exiting."
            exit 0
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          regenerate_master_readme() {
            MASTER_README="videos/README.md"
            { echo "# DOWNLOADED VIDEOS LIST :"; echo ""; echo "----"; echo ""; } > "$MASTER_README"
            VIDEO_EMOJIS=("🎬" "🎥" "📽️" "🎞️" "📺" "🎦" "▶️")
            NUM=0
            for folder in videos/*/; do
              [ -d "$folder" ] || continue
              FOLDER_NAME=$(basename "$folder")
              [ -f "$folder/README.md" ] || continue
              NUM=$((NUM + 1))
              RANDOM_EMOJI="${VIDEO_EMOJIS[$RANDOM % ${#VIDEO_EMOJIS[@]}]}"
              FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
              FOLDER_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/videos/${FOLDER_ENCODED}"
              printf -- "- %s - %s [%s](%s)\n" "$NUM" "$RANDOM_EMOJI" "$FOLDER_NAME" "$FOLDER_LINK" >> "$MASTER_README"
            done
          }

          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"
          mkdir -p videos
          cp -r "$BACKUP_DIR"/* videos/

          git add -A videos/
          regenerate_master_readme
          git add videos/README.md

          if ! git diff --cached --quiet; then
            git commit -m "YouTube download [skip ci]"
            PUSH_RETRY=0
            while [ $PUSH_RETRY -lt 10 ]; do
              PUSH_RETRY=$((PUSH_RETRY + 1))
              if timeout 300 git push origin HEAD:"$BRANCH"; then
                echo "Push successful!"
                break
              else
                echo "Push failed, retry $PUSH_RETRY/10..."
                sleep 5
                git fetch origin "$BRANCH"
                git reset --hard origin/"$BRANCH"
                mkdir -p videos
                cp -r "$BACKUP_DIR"/* videos/
                git add -A videos/
                regenerate_master_readme
                git add videos/README.md
                git diff --cached --quiet || git commit -m "YouTube download [skip ci]"
              fi
            done
          fi

          echo "=========================================="
          echo "All files pushed successfully!"
          echo "=========================================="
